<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>S1 Mirror</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }
  #app { position: relative; width: 100%; height: 100%; }

  /* TELA DE LISTA */
  #lista { position: absolute; inset: 0; overflow-y: auto; padding: 20px 16px 100px; background: #0a0a0a; }
  #lista h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  #lista .sub { font-size: 13px; color: #888; margin-bottom: 20px; }
  .item { display: flex; align-items: center; justify-content: space-between; padding: 16px; background: #161616; border-radius: 12px; margin-bottom: 10px; cursor: pointer; transition: background .15s; }
  .item:active { background: #222; }
  .item .nome { font-size: 16px; font-weight: 500; }
  .item .meta { font-size: 12px; color: #777; margin-top: 3px; }
  .item .badge { font-size: 10px; padding: 3px 8px; border-radius: 20px; background: #1e3a5f; color: #6db3f2; font-weight: 600; }
  .item .badge.img { background: #2d2d1e; color: #d4c46a; }

  /* PLAYER */
  #player { position: absolute; inset: 0; display: none; background: #000; }
  #player.on { display: block; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #stage canvas, #stage img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  #stage img { width: 100%; height: 100%; object-fit: contain; }

  /* BARRA SUPERIOR */
  #topbar { position: absolute; top: 0; left: 0; right: 0; padding: 12px 16px; display: flex; align-items: center; gap: 12px; background: linear-gradient(to bottom, rgba(0,0,0,.85), transparent); z-index: 10; transition: opacity .3s; }
  #topbar.hide { opacity: 0; pointer-events: none; }
  #btnVoltar { background: rgba(255,255,255,.12); border: none; color: #fff; width: 38px; height: 38px; border-radius: 50%; font-size: 18px; cursor: pointer; flex-shrink: 0; }
  #titulo { font-size: 15px; font-weight: 500; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #contador { font-size: 13px; color: #aaa; font-variant-numeric: tabular-nums; }

  /* CONTROLES INFERIORES */
  #bottombar { position: absolute; bottom: 0; left: 0; right: 0; padding: 16px; display: flex; align-items: center; justify-content: center; gap: 20px; background: linear-gradient(to top, rgba(0,0,0,.85), transparent); z-index: 10; transition: opacity .3s; }
  #bottombar.hide { opacity: 0; pointer-events: none; }
  .navbtn { background: rgba(255,255,255,.12); border: none; color: #fff; width: 52px; height: 52px; border-radius: 50%; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .navbtn:active { background: rgba(255,255,255,.25); }
  .navbtn:disabled { opacity: .25; }

  /* LOADING */
  #loading { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: #000; z-index: 20; }
  #loading.on { display: flex; }
  .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,.15); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #erro { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 30px; text-align: center; z-index: 25; background: #000; }
  #erro.on { display: flex; }
  #erro p { color: #f66; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div id="app">

  <div id="lista">
    <h1>S1 Mirror</h1>
    <div class="sub" id="subtitulo">Carregando...</div>
    <div id="itens"></div>
  </div>

  <div id="player">
    <div id="stage"></div>
    <div id="topbar">
      <button id="btnVoltar">←</button>
      <div id="titulo"></div>
      <div id="contador"></div>
    </div>
    <div id="bottombar">
      <button class="navbtn" id="btnPrev">‹</button>
      <button class="navbtn" id="btnNext">›</button>
    </div>
    <div id="loading"><div class="spinner"></div></div>
    <div id="erro"><p id="erroTxt"></p></div>
  </div>

</div>

<script>
// ============ CONFIG ============
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let musicas = [];
let atual = null;          // objeto da música aberta
let paginas = [];          // array de páginas (imagens ou páginas do PDF)
let indice = 0;            // página atual
let pdfDoc = null;
let renderizando = false;
let escala = 1.5;

const $ = id => document.getElementById(id);
const stage = $('stage');
const topbar = $('topbar');
const bottombar = $('bottombar');

// ============ CARREGAR LISTA ============
async function carregarLista() {
  try {
    const r = await fetch('musicas.json?v=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    musicas = await r.json();
    if (!Array.isArray(musicas)) musicas = musicas.musicas || [];
    renderLista();
  } catch (e) {
    $('subtitulo').textContent = 'Erro ao carregar musicas.json';
    console.error(e);
  }
}

function renderLista() {
  $('subtitulo').textContent = musicas.length + ' músicas';
  const box = $('itens');
  box.innerHTML = '';
  musicas.forEach((m, i) => {
    const total = m.pdf ? (m.paginas || 'PDF') : (m.total || m.slides || '?');
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML =
      '<div><div class="nome">' + (m.nome || m.titulo || 'Sem nome') + '</div>' +
      '<div class="meta">' + total + (m.pdf ? ' páginas' : ' slides') + '</div></div>' +
      '<div class="badge ' + (m.pdf ? '' : 'img') + '">' + (m.pdf ? 'PDF' : 'IMG') + '</div>';
    el.onclick = () => abrir(i);
    box.appendChild(el);
  });
}

// ============ ABRIR MÚSICA ============
async function abrir(i) {
  atual = musicas[i];
  indice = 0;
  pdfDoc = null;
  paginas = [];

  $('lista').style.display = 'none';
  $('player').classList.add('on');
  $('titulo').textContent = atual.nome || atual.titulo || '';
  $('erro').classList.remove('on');
  $('contador').textContent = '';

  if (atual.pdf) {
    await abrirPDF(atual.pdf);
  } else {
    abrirImagens();
  }
}

// ============ MODO PDF ============
async function abrirPDF(caminho) {
  $('loading').classList.add('on');
  try {
    const task = pdfjsLib.getDocument(caminho);
    pdfDoc = await task.promise;
    paginas = Array.from({ length: pdfDoc.numPages }, (_, i) => i + 1);
    $('loading').classList.remove('on');
    await renderPDF(0);
    atualizarContador();
  } catch (e) {
    $('loading').classList.remove('on');
    mostrarErro('Não foi possível abrir o PDF: ' + caminho);
    console.error(e);
  }
}

async function renderPDF(idx) {
  if (!pdfDoc || renderizando) return;
  renderizando = true;
  try {
    const page = await pdfDoc.getPage(idx + 1);
    const vp1 = page.getViewport({ scale: 1 });
    const dispW = stage.clientWidth || window.innerWidth;
    const dispH = stage.clientHeight || window.innerHeight;
    const s = Math.min(dispW / vp1.width, dispH / vp1.height) * (window.devicePixelRatio || 1);
    const vp = page.getViewport({ scale: s });

    let canvas = stage.querySelector('canvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      stage.innerHTML = '';
      stage.appendChild(canvas);
    }
    canvas.width = vp.width;
    canvas.height = vp.height;
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    canvas.style.objectFit = 'contain';

    const ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
  } catch (e) {
    console.error(e);
  }
  renderizando = false;
}

// ============ MODO IMAGENS ============
function abrirImagens() {
  const pasta = atual.pasta || atual.id || '';
  const total = atual.total || atual.slides || 0;
  if (!total) { mostrarErro('Total de slides não definido no musicas.json'); return; }
  paginas = Array.from({ length: total }, (_, i) => i + 1);
  stage.innerHTML = '';
  const img = document.createElement('img');
  img.id = 'slideImg';
  img.onerror = () => mostrarErro('Imagem não encontrada: ' + img.src);
  stage.appendChild(img);
  mostrarImagem(0);
  atualizarContador();
}

function mostrarImagem(idx) {
  const pasta = atual.pasta || atual.id || '';
  const img = $('slideImg');
  if (!img) return;
  img.src = pasta + '/' + (idx + 1) + '.jpg';
}

// ============ NAVEGAÇÃO ============
function irPara(novo) {
  if (!paginas.length) return;
  novo = Math.max(0, Math.min(paginas.length - 1, novo));
  if (novo === indice) return;
  indice = novo;
  if (atual.pdf) renderPDF(indice);
  else mostrarImagem(indice);
  atualizarContador();
}

function atualizarContador() {
  $('contador').textContent = (indice + 1) + ' / ' + paginas.length;
  $('btnPrev').disabled = indice === 0;
  $('btnNext').disabled = indice >= paginas.length - 1;
}

function mostrarErro(msg) {
  $('erroTxt').textContent = msg;
  $('erro').classList.add('on');
}

// ============ FECHAR ============
function fechar() {
  $('player').classList.remove('on');
  $('lista').style.display = 'block';
  stage.innerHTML = '';
  pdfDoc = null;
  paginas = [];
  atual = null;
}

// ============ EVENTOS ============
$('btnVoltar').onclick = fechar;
$('btnPrev').onclick = () => irPara(indice - 1);
$('btnNext').onclick = () => irPara(indice + 1);

// Teclado
document.addEventListener('keydown', e => {
  if (!$('player').classList.contains('on')) return;
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); irPara(indice + 1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); irPara(indice - 1); }
  if (e.key === 'Escape') fechar();
});

// Swipe
let touchX = 0, touchY = 0;
stage.addEventListener('touchstart', e => {
  touchX = e.changedTouches[0].screenX;
  touchY = e.changedTouches[0].screenY;
}, { passive: true });

stage.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].screenX - touchX;
  const dy = e.changedTouches[0].screenY - touchY;
  if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
  if (dx < 0) irPara(indice + 1);
  else irPara(indice - 1);
}, { passive: true });

// Toque simples mostra/esconde barras
let tapTimer = null;
stage.addEventListener('click', () => {
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => {
    topbar.classList.toggle('hide');
    bottombar.classList.toggle('hide');
  }, 200);
});

// Re-render ao girar tela
window.addEventListener('resize', () => {
  if (atual && atual.pdf && pdfDoc) renderPDF(indice);
});

// ============ INICIAR ============
carregarLista();
</script>
</body>
</html>
